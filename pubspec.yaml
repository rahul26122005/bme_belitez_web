name: belitez_2k26
description: B'Elitez 2K26 Biomedical Engineering Symposium website.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  firebase_analytics: ^12.0.0
  firebase_storage: ^13.0.2
  google_fonts: ^6.3.0
  provider: ^6.1.5
  image_picker: ^1.2.0
  intl: ^0.20.2
  excel: ^4.0.6
  web: ^1.1.1
  image: ^4.3.0
  url_launcher: ^6.3.2
  universal_html: ^2.3.0

dependency_overrides:
  firebase_core_web: 3.10.0
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/